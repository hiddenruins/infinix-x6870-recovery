name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Branch (this tree targets 12.1 only)'
        required: true
        default: '12.1'
        type: choice
        options:
        - '12.1'
      DEVICE_TREE:
        description: 'Device tree source (use "LOCAL" to use device tree from this repo)'
        required: true
        default: 'LOCAL'
      DEVICE_TREE_BRANCH:
        description: 'Device tree branch (ignored if LOCAL)'
        required: false
        default: 'main'
      DEVICE_PATH:
        description: 'Specify your device path.'
        required: true
        default: 'device/infinix/x6870'
      DEVICE_NAME:
        description: 'Specify your Device Codename.'
        required: true
        default: 'x6870'
      BUILD_TARGET:
        description: 'Build target (this device builds vendor_boot only)'
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - vendorboot
      STOCK_VENDOR_BOOT_URL:
        description: 'Optional: URL of the stock vendor_boot.img; if empty, repack locally after the build'
        required: false
        default: ''
      LDCHECK:
        description: 'Path of blobs to check' 
        required: true
        default: 'system/bin/qseecomd'
      RECOVERY_TAR:
        description: 'Release recovery.tar For Samsung devices'
        required: false
        default: false
        type: boolean
      RECOVERY_INSTALLER:
        description: 'Include recovery installer zip (unsafe on vendor_boot devices like x6870 - targets the boot partition)'
        type: boolean
        required: true
        default: false

jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Display Inputs
      run: |
        echo "::group::User Environment Variables"
        echo "Displaying variables/inputs."
        echo "Include Recovery Installer: ${{ github.event.inputs.RECOVERY_INSTALLER }}"
        echo "Release recovery.tar For Samsung devices: ${{ github.event.inputs.RECOVERY_TAR }}"
        echo "Stock vendor_boot URL: ${{ github.event.inputs.STOCK_VENDOR_BOOT_URL }}"
        echo "::endgroup::"

    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
      
    - name: Build Environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
      
    - name: Set-up Manifest
      if: github.event.inputs.MANIFEST_BRANCH == '12.1'
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "Samuel Kendall"
        git config --global user.email "kinguser981@gmail.com"
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Clone/Copy Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        if [ "${{ github.event.inputs.DEVICE_TREE }}" = "LOCAL" ] || [ "${{ github.event.inputs.DEVICE_TREE }}" = "local" ] || [ "${{ github.event.inputs.DEVICE_TREE }}" = "." ]; then
          echo "Using local device tree from this repository"
          mkdir -p $(dirname ${{ github.event.inputs.DEVICE_PATH }})
          rm -rf ./${{ github.event.inputs.DEVICE_PATH }}
          cp -r ${GITHUB_WORKSPACE}/${{ github.event.inputs.DEVICE_PATH }} ./${{ github.event.inputs.DEVICE_PATH }}
          echo "COMMIT_ID=$(git -C ${GITHUB_WORKSPACE} rev-parse HEAD 2>/dev/null || echo local)" >> $GITHUB_ENV
        else
          git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
          cd ${{ github.event.inputs.DEVICE_PATH }}
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
        fi

    - name: Check Manifest Branch
      uses: haya14busa/action-cond@v1
      id: fox_branch
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == '12.1' }}
        if_true: lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng && make clean && mka adbd ${{ github.event.inputs.BUILD_TARGET }}image
        if_false: lunch omni_${{ github.event.inputs.DEVICE_NAME }}-eng && make clean && mka ${{ github.event.inputs.BUILD_TARGET }}image
      
    - name: Building OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        ${{ steps.fox_branch.outputs.value }}

    - name: Set Build Date
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        if [ "${{ github.event.inputs.BUILD_TARGET }}" = "vendorboot" ] && [ -z "${{ github.event.inputs.STOCK_VENDOR_BOOT_URL }}" ]; then
          echo "NEEDS_REPACK=yes" >> $GITHUB_ENV
        else
          echo "NEEDS_REPACK=no" >> $GITHUB_ENV
        fi
        if [ "${{ github.event.inputs.DEVICE_TREE }}" = "LOCAL" ] || [ "${{ github.event.inputs.DEVICE_TREE }}" = "local" ] || [ "${{ github.event.inputs.DEVICE_TREE }}" = "." ]; then
          echo "DEVICE_TREE_URL=https://github.com/${{ github.repository }}" >> $GITHUB_ENV
        else
          DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
          if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
            DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
          fi
          echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV
        fi

    - name: Check if Recovery Exist
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        OUT_DIR=out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        NESTED=$OUT_DIR/target/product/${{ github.event.inputs.DEVICE_NAME }}

        if ls $OUT_DIR/OrangeFox*.img >/dev/null 2>&1; then
            :
        elif ls $NESTED/OrangeFox*.img >/dev/null 2>&1; then
            OUT_DIR=$NESTED
        elif [ -f $OUT_DIR/vendor_boot.img ] && [ "${{ github.event.inputs.BUILD_TARGET }}" = "vendorboot" ]; then
            echo "::warning title=OrangeFox post-build hook did not run::Falling back to the raw vendor_boot.img (no OrangeFox*.img was produced)."
        else
            echo "Recovery out directory is empty."
            exit 1
        fi

        IMG=$(ls $OUT_DIR/OrangeFox*.img 2>/dev/null | head -n 1 || true)
        [ -n "$IMG" ] || IMG=$OUT_DIR/vendor_boot.img
        [ -f "$IMG" ] || { echo "Recovery image not found in $OUT_DIR"; exit 1; }

        echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
        echo "FILE_PATH=${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/$OUT_DIR" >> $GITHUB_ENV
        echo "IMG_PATH=${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/$IMG" >> $GITHUB_ENV
        echo "MD5_IMG=$(md5sum "$IMG" | cut -d ' ' -f 1)" >> $GITHUB_ENV

    - name: Rename the Recovery
      run: |
        cd "$FILE_PATH"
        case "${{ github.event.inputs.BUILD_TARGET }}" in
          boot)      RECOVERY_TYPE=boot ;;
          recovery)  RECOVERY_TYPE=recovery ;;
          vendorboot) RECOVERY_TYPE=vendor_boot ;;
          *)         RECOVERY_TYPE=${{ github.event.inputs.BUILD_TARGET }} ;;
        esac
        if [ "$(basename "$IMG_PATH")" != "$RECOVERY_TYPE.img" ]; then
          mv -f "$IMG_PATH" "$RECOVERY_TYPE.img"
        fi
        echo "RECOVERY_TYPE=$RECOVERY_TYPE" >> $GITHUB_ENV
      
    - name: Repack vendor_boot with the stock platform ramdisk
      if: github.event.inputs.BUILD_TARGET == 'vendorboot' && github.event.inputs.STOCK_VENDOR_BOOT_URL != ''
      run: |
        set -euo pipefail
        FOX_ROOT="${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
        export PATH="${FOX_ROOT}/out/host/linux-x86/bin:${PATH}"
        command -v lz4 >/dev/null || { sudo apt-get update && sudo apt-get install -y lz4; }
        command -v zstd >/dev/null || { sudo apt-get update && sudo apt-get install -y zstd; }
        command -v mkbootimg >/dev/null || { echo "::error::mkbootimg not found under ${FOX_ROOT}/out/host/linux-x86/bin"; exit 1; }
        command -v unpack_bootimg >/dev/null || { echo "::error::unpack_bootimg not found under ${FOX_ROOT}/out/host/linux-x86/bin"; exit 1; }
        cd "$FILE_PATH"
        echo "Downloading stock vendor_boot..."
        curl -fL --retry 3 --retry-delay 5 -o stock_vendor_boot.img "${{ github.event.inputs.STOCK_VENDOR_BOOT_URL }}"
        STOCK_IMG="$PWD/stock_vendor_boot.img" \
          "${GITHUB_WORKSPACE}/tools/repack_vendor_boot.sh" vendor_boot.img vendor_boot-repacked.img
        mv -f vendor_boot-repacked.img vendor_boot.img
        rm -f stock_vendor_boot.img
        echo "MD5_IMG=$(md5sum vendor_boot.img | cut -d ' ' -f 1)" >> $GITHUB_ENV

    - name: Warn about un-repacked vendor_boot
      if: github.event.inputs.BUILD_TARGET == 'vendorboot' && github.event.inputs.STOCK_VENDOR_BOOT_URL == ''
      run: |
        echo "::warning title=Un-repacked vendor_boot::This image was built without the stock platform ramdisk. All MTK kernel modules (display, touch, storage) live in stock fragment 0, so do NOT flash it as-is. Repack it locally first: STOCK_IMG=stock/vendor_boot_a.img tools/repack_vendor_boot.sh <downloaded vendor_boot.img> out/vendor_boot.img"

    - name: Include Recovery Installer
      # The upstream installer picks /dev/block/by-name/boot when there is no
      # dedicated recovery partition, so on this vendor_boot-as-recovery device it
      # would overwrite boot_a/boot_b. It also only looks for recovery.img/twrp*.img,
      # not vendor_boot.img, so the generated zip is not usable here anyway.
      run: |
        if [ ${{ github.event.inputs.RECOVERY_INSTALLER }} = true ]; then
          cd ${{ env.FILE_PATH }}/
          wget -O recovery-installer.zip https://github.com/kinguser981/recovery-installer/releases/download/11256427880/recovery-installer.zip || true
          [ -f recovery-installer.zip ] && zip -ur recovery-installer.zip ${{ env.RECOVERY_TYPE }}.img || true
        fi
      continue-on-error: true
        
    - name: Recovery to tar for Samsung devices
      run: |
        if [ ${{ github.event.inputs.RECOVERY_TAR }} = true ]; then
          cd ${{ env.FILE_PATH }}/
          tar -cvf ${{ env.RECOVERY_TYPE }}.tar ${{ env.RECOVERY_TYPE }}.img
        fi
      continue-on-error: true

    - name: Upload to Release
      if: env.CHECK_IMG_IS_OK == 'true'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.img
          ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.tar
          ${{ env.FILE_PATH }}/recovery-installer.zip
          ${{ env.FILE_PATH }}/OrangeFox*.zip
        name: Unofficial OrangeFox for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Build: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: [${{ github.repository }}](${{ env.DEVICE_TREE_URL }})
          Commit: [${{ env.COMMIT_ID }}](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }})
          MD5 (img): ${{ env.MD5_IMG }}
          ${{ env.NEEDS_REPACK == 'yes' && '**WARNING: not repacked with the stock platform ramdisk - repack locally before flashing (see README).**' || '' }}
